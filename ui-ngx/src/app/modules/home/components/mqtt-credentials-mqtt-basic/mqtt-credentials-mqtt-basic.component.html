<section [formGroup]="credentialsMqttBasicFormGroup">
  <mat-form-field class="mat-block">
    <mat-label translate>device.client-id</mat-label>
    <input matInput formControlName="clientId">
    <mat-error *ngIf="credentialsMqttBasicFormGroup.get('clientId').hasError('pattern')">
      {{ 'device.client-id-pattern' | translate }}
    </mat-error>
  </mat-form-field>
  <mat-form-field class="mat-block">
    <mat-label translate>device.user-name</mat-label>
    <input matInput formControlName="userName" [required]="!!credentialsMqttBasicFormGroup.get('password').value">
    <mat-error *ngIf="credentialsMqttBasicFormGroup.get('userName').hasError('required')">
      {{ 'device.user-name-required' | translate }}
    </mat-error>
  </mat-form-field>
  <mat-form-field class="mat-block">
    <mat-label translate>device.password</mat-label>
    <input matInput formControlName="password"
           autocomplete="new-password"
           (ngModelChange)="passwordChanged()"
           type="password">
    <tb-toggle-password matSuffix></tb-toggle-password>
  </mat-form-field>
  <tb-error style="margin-top: -12px; display: block;"
            [error]="credentialsMqttBasicFormGroup.hasError('atLeastOne') ?
              ('device.client-id-or-user-name-necessary' | translate) : ''"></tb-error>
</section>
