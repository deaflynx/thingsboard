<section [formGroup]="credentialsMqttFormGroup">
  <mat-form-field class="mat-block">
    <mat-label translate>mqtt-client-credentials.client-id</mat-label>
    <input matInput formControlName="clientId">
    <mat-error *ngIf="credentialsMqttFormGroup.get('clientId').hasError('pattern')">
      {{ 'mqtt-client-credentials.client-id-pattern' | translate }}
    </mat-error>
  </mat-form-field>
  <mat-form-field class="mat-block">
    <mat-label translate>mqtt-client-credentials.user-name</mat-label>
    <input matInput formControlName="userName" [required]="!!credentialsMqttFormGroup.get('password').value">
    <mat-error *ngIf="credentialsMqttFormGroup.get('userName').hasError('required')">
      {{ 'mqtt-client-credentials.user-name-required' | translate }}
    </mat-error>
  </mat-form-field>
  <mat-form-field class="mat-block">
    <mat-label translate>mqtt-client-credentials.password</mat-label>
    <input matInput formControlName="password"
           autocomplete="new-password"
           (ngModelChange)="passwordChanged()"
           type="password">
    <tb-toggle-password matSuffix></tb-toggle-password>
  </mat-form-field>
  <tb-error style="margin-top: -12px; display: block;"
            [error]="credentialsMqttFormGroup.hasError('atLeastOne') ?
              ('mqtt-client-credentials.client-id-or-user-name-necessary' | translate) : ''"></tb-error>
</section>
